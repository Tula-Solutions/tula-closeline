name: verify

# The one definition of CI for every Closeline repo. Each repo's ci.yml calls this workflow, so the
# gate is changed here and nowhere else. It runs `bun run verify`, the same command agents and
# people run locally.

on:
  workflow_call:
    secrets:
      CLOSELINE_REPO_TOKEN:
        description: Read access to the private tula-closeline-* repos, for git dependencies.
        required: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # Libraries are declared as git+ssh URLs and the runner has no SSH key. The repos are public,
      # so plain https works; the token is only needed if a repo is made private again.
      - name: Fetch tula-closeline-* dependencies over https
        env:
          TOKEN: ${{ secrets.CLOSELINE_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          else
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          fi
      - run: bun install --frozen-lockfile
      - run: bun run verify
      # Optional, per repo: a `test:integration` script runs against real services. If the repo
      # also commits a compose file, it is started first, so the script needs no environment
      # beyond what that file sets up. A repo without the script skips this step.
      - name: Integration tests
        run: |
          if ! jq -e '.scripts["test:integration"]' package.json > /dev/null; then
            echo "No test:integration script; skipping."
            exit 0
          fi
          for file in compose.yaml compose.yml docker-compose.yaml docker-compose.yml; do
            if [ -f "$file" ]; then
              docker compose up -d --wait --wait-timeout 120
              break
            fi
          done
          bun run test:integration
