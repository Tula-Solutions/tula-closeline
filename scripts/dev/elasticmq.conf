# ElasticMQ configuration for the dev stack (mounted by compose.dev.yaml).
# Placeholder queue names: the queue port (plan step 1.10) decides the real ones.
include classpath("application.conf")
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
queues {
  closeline-dev-dlq { }
  # The playbook's ingestion queue (the QUEUE_URL scripts/dev-lib.ts gives it).
  closeline-playbook {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "closeline-dev-dlq"
      maxReceiveCount = 5
    }
  }
  # Core's background jobs queue (the JOBS_QUEUE_URL scripts/dev-lib.ts gives it), with its own DLQ.
  core-jobs-dlq { }
  core-jobs {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "core-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  # Core's audit event queue (the AUDIT_QUEUE_URL scripts/dev-lib.ts gives it), with its own DLQ.
  core-audit-dlq { }
  core-audit {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "core-audit-dlq"
      maxReceiveCount = 5
    }
  }
  closeline-dev {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "closeline-dev-dlq"
      maxReceiveCount = 5
    }
  }
}
